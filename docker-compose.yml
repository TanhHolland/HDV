    container_name: qbike-eureka
    ports:
      - "8761:8761"
    networks:
      - booking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

