version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: nhom4-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 170903
      MYSQL_DATABASE: nhom4
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - booking-network
    command: --init-file=/docker-entrypoint-initdb.d/init-db.sql
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

  redis:
    image: redis:7-alpine
    container_name: nhom4-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - booking-network
    deploy:
      restart_policy:
        condition: on-failure

  # Thêm Redis Commander
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: nhom4-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - booking-network
    depends_on:
      - redis
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  rabbitmq:
    image: rabbitmq:3-management
    container_name: nhom4-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - booking-network
    deploy:
      restart_policy:
        condition: on-failure

  eureka:
    environment:
      - SERVER_PORT=8761
      - EUREKA_INSTANCE_HOSTNAME=discovery
      - EUREKA_CLIENT_REGISTERWITHEUREKA=false
      - EUREKA_CLIENT_FETCHREGISTRY=false
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka/
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus,metrics
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW-DETAILS=always
      - MANAGEMENT_ENDPOINT_METRICS_ENABLED=true
      - MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED=true
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES-HISTOGRAM_HTTP_SERVER_REQUESTS=true
    build:
      context: ./eureka
      dockerfile: Dockerfile
    container_name: nhom4-eureka
    ports:
      - "8761:8761"
    networks:
      - booking-network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # UC Service với 2 instance
  uc-service-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: nhom4-user
        SERVICE_PORT: "8000"
    container_name: uc-service-1
    depends_on:
      - mysql
      - eureka
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nhom4_uc?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 170903
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SERVER_PORT: 8000
      SPRING_APPLICATION_NAME: UC-SERVICE
    networks:
      - booking-network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  uc-service-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: nhom4-user
        SERVICE_PORT: "8000"
    container_name: uc-service-2
    depends_on:
      - mysql
      - eureka
    ports:
      - "8011:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nhom4_uc?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 170903
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SERVER_PORT: 8000
      SPRING_APPLICATION_NAME: UC-SERVICE
    networks:
      - booking-network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # Position Service với 2 instance
  position-service-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: nhom4-position
        SERVICE_PORT: "8003"
    container_name: position-service-1
    depends_on:
      - mysql
      - redis
      - eureka
      - uc-service-1
    ports:
      - "8003:8003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nhom4_position?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 170903
      SPRING_REDIS_HOST: redis
      BOOKING_UC_URL: http://uc-service-1:8000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SERVER_PORT: 8003
      SPRING_APPLICATION_NAME: POSITION-SERVICE
    networks:
      - booking-network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  position-service-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: nhom4-position
        SERVICE_PORT: "8003"
    container_name: position-service-2
    depends_on:
      - mysql
      - redis
      - eureka
      - uc-service-1
    ports:
      - "8012:8003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nhom4_position?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 170903
      SPRING_REDIS_HOST: redis
      BOOKING_UC_URL: http://uc-service-1:8000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SERVER_PORT: 8003
      SPRING_APPLICATION_NAME: POSITION-SERVICE
    networks:
      - booking-network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # Intention Service với 2 instance
  intention-service-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: nhom4-intention
        SERVICE_PORT: "8001"
    container_name: intention-service-1
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - eureka
    ports:
      - "8001:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nhom4_intention?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 170903
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SERVER_PORT: 8001
      SPRING_APPLICATION_NAME: INTENTION-SERVICE
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - booking-network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  intention-service-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: nhom4-intention
        SERVICE_PORT: "8001"
    container_name: intention-service-2
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - eureka
    ports:
      - "8013:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nhom4_intention?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 170903
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SERVER_PORT: 8001
      SPRING_APPLICATION_NAME: INTENTION-SERVICE
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - booking-network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # Order Service với 2 instance
  order-service-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: nhom4-order
        SERVICE_PORT: "8002"
    container_name: order-service-1
    depends_on:
      - mysql
      - rabbitmq
      - eureka
    ports:
      - "8002:8002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nhom4_order?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 170903
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SERVER_PORT: 8002
      SPRING_APPLICATION_NAME: ORDER-SERVICE
    networks:
      - booking-network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.3'
