      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SERVER_PORT: 8002
      SPRING_APPLICATION_NAME: ORDER-SERVICE
    networks:
      - booking-network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.3'
          memory: 384M


  gateway-1:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-1
    depends_on:
      - eureka
      - uc-service-1
      - position-service-1
      - intention-service-1
      - order-service-1
    ports:
      - "8800:8800"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SERVER_PORT: 8800
      SPRING_APPLICATION_NAME: GATEWAY
    networks:
      - booking-network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  gateway-2:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-2
    depends_on:
